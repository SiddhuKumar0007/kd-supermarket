<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KD Supermarket - Store QR Standee</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .print-btn {
      margin-bottom: 20px;
      padding: 12px 28px;
      background: #0A6847;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(10, 104, 71, 0.3);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .print-btn:hover { background: #085238; }
    
    .card {
      width: 420px;
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      border: 3px solid #0A6847;
      text-align: center;
      position: relative;
    }

    .header {
      background: linear-gradient(135deg, #0A6847 0%, #064e3b 100%);
      color: #ffffff;
      padding: 28px 20px 20px;
      position: relative;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F59E0B;
      color: #111827;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .brand-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }
    .brand-subtitle {
      font-size: 13px;
      color: #d1fae5;
      margin-top: 4px;
      font-weight: 500;
    }
    .location-tag {
      font-size: 11px;
      color: #fef3c7;
      margin-top: 6px;
      font-weight: 700;
    }

    .qr-container {
      padding: 24px 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
    }
    .scan-pill {
      background: #ecfdf5;
      color: #065f46;
      border: 1.5px solid #a7f3d0;
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .qr-frame {
      padding: 14px;
      background: #ffffff;
      border: 3px dashed #0A6847;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(10, 104, 71, 0.08);
      position: relative;
    }
    .qr-frame img {
      width: 250px;
      height: 250px;
      display: block;
      border-radius: 12px;
    }
    .url-display {
      margin-top: 14px;
      font-size: 22px;
      font-weight: 900;
      color: #0A6847;
      letter-spacing: 0.5px;
    }
    .url-sub {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .features {
      display: flex;
      justify-content: space-around;
      padding: 14px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
    }
    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: #334155;
      gap: 2px;
    }
    .feature-icon {
      font-size: 16px;
    }

    .footer {
      background: #ffffff;
      padding: 14px 20px;
      font-size: 12px;
      color: #475569;
      font-weight: 600;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    .whatsapp-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #059669;
      font-weight: 800;
    }

    @media print {
      body { background: #fff; padding: 0; justify-content: flex-start; }
      .print-btn { display: none; }
      .card { box-shadow: none; border: 3px solid #0A6847; margin: 0 auto; page-break-inside: avoid; }
    }
  </style>
</head>
